apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook-ingress
  namespace: monitoring
  labels:
   release: prometheus
spec:
  ingressClassName: nginx
  rules:
  - host: webhook.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k8s-incident-agent-webhook
            port:
              number: 5005

