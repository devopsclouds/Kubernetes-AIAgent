apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: main-rules-alert-config
  namespace: monitoring
  labels:
    release: prometheus
spec:
  route:
    repeatInterval: 30m
    receiver: 'null'
    routes:
      - matchers:
          - name: alertname
            value: HighCpuUsage
        receiver: 'send-email'
      - matchers:
          - name: alertname
            value: PodRestart
        receiver: 'send-email'
        repeatInterval: 5m
      - matchers:
          - name: alertname
            value: PodNotRunning
        receiver: 'send-email'
      - matchers:
          - name: alertname
            value: PodOOMKilled
        receiver: 'send-email'
      - matchers:
          - name: alertname
            value: PodPending
        receiver: 'send-email'
      - matchers:
          - name: alertname
            value: PodImagePullBackOff
        receiver: 'send-email'

  receivers:
    - name: 'send-email'
      emailConfigs:
        - to: devops.clouds8978@gmail.com
          from: devops.clouds8978@gmail.com
          sendResolved: false
          smarthost: smtp.gmail.com:587
          authUsername: devops.clouds8978@gmail.com
          authIdentity: devops.clouds8978@gmail.com
          authPassword:
            name: mail-pass
            key: gmail-pass
      webhookConfigs:
        - url: 'http://k8s-incident-agent-webhook.monitoring.svc.cluster.local:5005/webhook'
          sendResolved: false
    - name: 'null'
