apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: haproxy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: haproxy

  template:
    metadata:
      labels:
        app: haproxy

    spec:
      containers:
        - name: haproxy
          image: haproxy:3.0

          ports:
            - name: http
              containerPort: 80

            - name: https
              containerPort: 443

          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg

            - name: tls
              mountPath: /etc/haproxy/certs
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: haproxy-config

        - name: tls
          secret:
            secretName: haproxy-tls
