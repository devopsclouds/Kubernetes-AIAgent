apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: javaapp-route
  namespace: dev
spec:
  parentRefs:
    - name: gateway-api
      namespace: gateway-api

  hostnames:
    - myapp1.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sample

      backendRefs:
        - name: javaapp-service
          port: 8080
