apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-api
  namespace: gateway-api
spec:
  gatewayClassName: gateway-api

  infrastructure:
    parametersRef:
      group: apisix.apache.org
      kind: GatewayProxy
      name: apisix-config

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: myapp1.local
      allowedRoutes:
        namespaces:
          from: All
