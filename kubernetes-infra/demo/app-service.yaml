---
# SCENARIO 5: Pod stuck Pending — requests more memory than node has
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heavy-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heavy-service
  template:
    metadata:
      labels:
        app: heavy-service
    spec:
      containers:
      - name: heavy-service
        image: httpd
        resources:
          requests:
            memory: "50Gi"    # No node has 50GB free
            cpu: "32"         # No node has 32 CPUs free
          limits:
            memory: "50Gi"
            cpu: "32"
---
apiVersion: v1
kind: Service
metadata:
  name: heavy-service
  namespace: dev
spec:
  selector:
    app: heavy-service
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heavy-service
  namespace: dev
spec:
  ingressClassName: nginx  # Only if your ingress class is nginx
  rules:
  - host: myapp1.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: heavy-service
            port:
              number: 80
