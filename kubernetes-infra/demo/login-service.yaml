---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-service
  template:
    metadata:
      labels:
        app: login-service
    spec:
      containers:
      - name: login-service
        image: nginx:8978
---
apiVersion: v1
kind: Service
metadata:
  name: login-service
  namespace: dev
spec:
  selector:
    app: login-service
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: login-service
  namespace: dev
spec:
  ingressClassName: nginx  # Only if your ingress class is nginx
  rules:
  - host: myapp2.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 80
