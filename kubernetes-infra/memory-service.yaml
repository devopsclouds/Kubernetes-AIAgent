apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      containers:
      - name: memory-service
        image: progrium/stress
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "200Mi"
        command:
        - stress
        args:
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "150M"
        - "--vm-hang"
        - "1"
